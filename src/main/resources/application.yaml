spring:
  application:
    name: mirrorsoul-api

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  server:
    port: 8080

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:mirrorsoul-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

chat:
  websocket:
    allowed-origin-patterns: ${CHAT_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:5}
  sqs:
    voice-training-queue-url: ${AWS_SQS_VOICE_TRAINING_QUEUE_URL}

vector:
  datasource:
    enabled: ${VECTOR_DB_ENABLED:false}
    url: jdbc:postgresql://${VECTOR_DB_HOST:localhost}:${VECTOR_DB_PORT:5432}/${VECTOR_DB_NAME:mirrorsoul_vector}
    username: ${VECTOR_DB_USERNAME:}
    password: ${VECTOR_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${VECTOR_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${VECTOR_DB_MIN_IDLE:1}
      connection-timeout: ${VECTOR_DB_CONNECTION_TIMEOUT_MS:3000}

gemini:
  embedding:
    enabled: ${GEMINI_EMBEDDING_ENABLED:true}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:1536}
    task-type: ${GEMINI_EMBEDDING_TASK_TYPE:SEMANTIC_SIMILARITY}

region:
  geocoding:
    enabled: ${REGION_GEOCODING_ENABLED:false}
    kakao-rest-api-key: ${KAKAO_REST_API_KEY:}
    delay-ms: ${REGION_GEOCODING_DELAY_MS:100}
