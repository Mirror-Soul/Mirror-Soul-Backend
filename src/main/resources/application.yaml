spring:
  application:
    name: mirrorsoul-api

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: mysql

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  server:
    port: 8080

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:mirrorsoul-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

chat:
  websocket:
    allowed-origin-patterns: ${CHAT_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

push:
  firebase:
    enabled: ${FIREBASE_PUSH_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    android-channel-id: ${FIREBASE_ANDROID_CHANNEL_ID:chat_messages}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:5}
  sqs:
    voice-training-queue-url: ${AWS_SQS_VOICE_TRAINING_QUEUE_URL}
    face-training-queue-url: ${AWS_SQS_FACE_TRAINING_QUEUE_URL}
    value-balance-analysis-queue-url: ${AWS_SQS_VALUE_BALANCE_ANALYSIS_QUEUE_URL}

value-balance:
  callback-secret: ${VALUE_BALANCE_CALLBACK_SECRET}

face-result:
  enabled: ${FACE_RESULT_CONSUMER_ENABLED:false}
  queue-url: ${AWS_SQS_FACE_TRAINING_RESULT_QUEUE_URL:}
  wait-time-seconds: 10
  visibility-timeout-seconds: 120

clone-training:
  callback-secret: ${CLONE_TRAINING_CALLBACK_SECRET:}

rag:
  profile:
    enabled: ${RAG_PROFILE_ENABLED:false}
    base-url: ${AI_SERVER_BASE_URL:}
    poll-ms: ${RAG_PROFILE_POLL_MS:10000}

vector:
  datasource:
    enabled: ${VECTOR_DB_ENABLED:true}
    url: jdbc:postgresql://${VECTOR_DB_HOST}:${VECTOR_DB_PORT:5432}/${VECTOR_DB_NAME:mirrorsoul_vector}
    username: ${VECTOR_DB_USERNAME:}
    password: ${VECTOR_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: postgresql
      maximum-pool-size: ${VECTOR_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${VECTOR_DB_MIN_IDLE:1}
      connection-timeout: ${VECTOR_DB_CONNECTION_TIMEOUT_MS:3000}

gemini:
  embedding:
    enabled: ${GEMINI_EMBEDDING_ENABLED:true}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:1536}
    task-type: ${GEMINI_EMBEDDING_TASK_TYPE:SEMANTIC_SIMILARITY}
  generation:
    enabled: ${GEMINI_GENERATION_ENABLED:false}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_GENERATION_MODEL:gemini-3.6-flash}
    temperature: ${GEMINI_GENERATION_TEMPERATURE:0.3}
    max-output-tokens: ${GEMINI_GENERATION_MAX_OUTPUT_TOKENS:1500}
    prompt-version: ${GEMINI_GENERATION_PROMPT_VERSION:clone-profile-v1}

clone-profile:
  generation:
    max-interviews: ${CLONE_PROFILE_MAX_INTERVIEWS:20}
    max-question-characters: ${CLONE_PROFILE_MAX_QUESTION_CHARACTERS:300}
    max-answer-characters: ${CLONE_PROFILE_MAX_ANSWER_CHARACTERS:1000}
    max-total-characters: ${CLONE_PROFILE_MAX_TOTAL_CHARACTERS:12000}
    max-attempts: ${CLONE_PROFILE_MAX_ATTEMPTS:3}
    interview-compaction-version: recent-v1
    recovery-delay-ms: ${CLONE_PROFILE_RECOVERY_DELAY_MS:30000}

region:
  geocoding:
    enabled: ${REGION_GEOCODING_ENABLED:false}
    kakao-rest-api-key: ${KAKAO_REST_API_KEY:}
    delay-ms: ${REGION_GEOCODING_DELAY_MS:100}

# App metrics are pushed directly to CloudWatch; no public Actuator endpoint is needed.
management:
  endpoints:
    web:
      exposure:
        exclude: "*"
    jmx:
      exposure:
        exclude: "*"

monitoring:
  cloudwatch:
    enabled: ${CLOUDWATCH_METRICS_ENABLED:false}
    namespace: ${CLOUDWATCH_METRICS_NAMESPACE:MirrorSoul/API}
    region: ${AWS_REGION:ap-northeast-2}
    step: ${CLOUDWATCH_METRICS_STEP:60s}
    environment: ${APP_ENV:local}
    instance: ${METRICS_INSTANCE_ID:api-1}
