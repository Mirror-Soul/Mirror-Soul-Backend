spring:
  datasource:
    url: jdbc:h2:mem:mirrorsoul_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  mail:
    host: localhost
    port: 2525
    username: test
    password: test

jwt:
  secret: mirrorsoul-test-jwt-secret-key-must-be-at-least-32-bytes
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600

aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    presigned-url-expiration-minutes: 5
  sqs:
    voice-training-queue-url: https://sqs.ap-northeast-2.amazonaws.com/123456789012/test-voice-training
    face-training-queue-url: https://sqs.ap-northeast-2.amazonaws.com/123456789012/test-face-training
